<title>Nati & Jose Manuel — 17.10.2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;min-height:100svh;
  background:#1a2e20;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
}
.wrapper{
  position:relative;
  width:100%;
  max-width:680px;
  padding:16px;
  cursor:pointer;
  animation:fadeIn 1.8s ease forwards;
  opacity:0;
}
@keyframes fadeIn{
  0%{opacity:0;transform:scale(0.94)}
  100%{opacity:1;transform:scale(1)}
}
.convite-img{
  width:100%;
  display:block;
  border-radius:10px;
  box-shadow:0 24px 70px rgba(0,0,0,0.6);
  transition:transform 0.3s ease, box-shadow 0.3s ease;
}
.wrapper:hover .convite-img{
  transform:scale(1.01);
  box-shadow:0 30px 80px rgba(0,0,0,0.7);
}
/* Shimmer dourado */
.shimmer{
  position:absolute;
  inset:16px;
  border-radius:10px;
  background:linear-gradient(
    105deg,
    transparent 30%,
    rgba(255,223,100,0.07) 45%,
    rgba(255,215,50,0.14) 50%,
    rgba(255,223,100,0.07) 55%,
    transparent 70%
  );
  background-size:300% 100%;
  animation:shimmer 3.5s ease-in-out infinite;
  pointer-events:none;
}
@keyframes shimmer{
  0%{background-position:200% center}
  100%{background-position:-200% center}
}
/* Partículas */
.particle{
  position:fixed;
  border-radius:50%;
  background:rgba(201,168,76,0.3);
  animation:float linear infinite;
  pointer-events:none;
}
@keyframes float{
  0%{transform:translateY(100vh) rotate(0deg);opacity:0}
  10%{opacity:1}
  90%{opacity:0.3}
  100%{transform:translateY(-10vh) rotate(720deg);opacity:0}
}
/* Redirect overlay */
.redirect{
  display:none;
  position:fixed;
  inset:0;
  background:#2d4a3e;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
  gap:16px;
}
.redirect.show{display:flex}
.redirect-icon{font-size:56px;animation:pulse 1s ease-in-out infinite}
.redirect-text{
  color:#c9a84c;
  font-family:'Georgia',serif;
  font-size:18px;
  letter-spacing:3px;
  text-transform:uppercase;
  animation:blink 1s ease-in-out infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.4}}
</style>
</head>
